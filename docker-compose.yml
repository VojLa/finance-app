services:
  db:
    image: postgres:16-alpine
    container_name: finance-app-db
    environment:
      POSTGRES_DB: finance_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: finance-app-web
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-development-secret-change-me}"
      PYTHON_BACKEND_URL: http://api:8010
      INTERNAL_AUTH_SECRET: development-internal-auth-secret-change-me
      INTERNAL_AUTH_ISSUER: finance-app-next
      INTERNAL_AUTH_AUDIENCE: finance-app-python
      INTERNAL_AUTH_TOKEN_TTL_SECONDS: "60"
      PYTHON_API_TIMEOUT_MS: "60000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/python/Dockerfile
    container_name: finance-app-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010 --reload
    ports:
      - "8010:8010"
    volumes:
      - ./backend/python:/app/backend/python
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/finance_app
      INTERNAL_AUTH_SECRET: development-internal-auth-secret-change-me
      INTERNAL_AUTH_ISSUER: finance-app-next
      INTERNAL_AUTH_AUDIENCE: finance-app-python
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY}
      MARKET_EVIDENCE_SOURCE_MODE: "${MARKET_EVIDENCE_SOURCE_MODE:-canonical}"
      BACKGROUND_JOBS_ENABLED: "true"
      BACKGROUND_JOB_POLL_SECONDS: "0.75"
      BACKGROUND_JOB_LEASE_SECONDS: "300"
      BACKGROUND_JOB_HEARTBEAT_SECONDS: "15"
      BACKGROUND_JOB_SHUTDOWN_GRACE_SECONDS: "5"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8010/api/v1/health/live')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  node_modules:
  next_cache:
