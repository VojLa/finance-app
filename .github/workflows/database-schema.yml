name: Database Schema

on:
  pull_request:
    paths:
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "backend/python/alembic.ini"
      - "backend/python/migrations/**"
      - "backend/python/app/db/**"
      - "backend/python/app/lifespan.py"
      - "backend/python/app/modules/portfolio/**"
      - "backend/python/database/**"
      - "backend/python/pyproject.toml"
      - "backend/python/scripts/**"
      - "backend/python/tests/**"
      - "backend/python/uv.lock"
      - ".github/workflows/database-schema.yml"
  push:
    branches:
      - main
    paths:
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "backend/python/alembic.ini"
      - "backend/python/migrations/**"
      - "backend/python/app/db/**"
      - "backend/python/app/lifespan.py"
      - "backend/python/app/modules/portfolio/**"
      - "backend/python/database/**"
      - "backend/python/pyproject.toml"
      - "backend/python/scripts/**"
      - "backend/python/tests/**"
      - "backend/python/uv.lock"
      - ".github/workflows/database-schema.yml"

permissions:
  contents: read

jobs:
  verify-schema:
    name: Verify Alembic-owned schema
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finance_app
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/python/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/python/uv.lock

      - name: Install backend dependencies
        working-directory: backend/python
        run: uv sync --frozen --extra dev

      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16

      - name: Enforce Alembic migration and schema artifact policy
        working-directory: backend/python
        run: uv run python scripts/migration_policy.py --check

      - name: Load immutable inherited schema baseline
        working-directory: backend/python
        run: |
          psql --host localhost --username postgres --dbname finance_app --command 'DROP SCHEMA public CASCADE;'
          psql --host localhost --username postgres --dbname finance_app --set ON_ERROR_STOP=1 --file database/baseline/schema.sql

      - name: Verify inherited canonical schema
        working-directory: backend/python
        run: |
          uv run python scripts/database_schema.py --check --revision 3d0001base
          uv run python scripts/alembic_baseline.py --verify

      - name: Run static metadata and migration tests
        working-directory: backend/python
        run: >-
          uv run pytest
          tests/test_database_schema.py
          tests/test_database_models.py
          tests/test_database_url.py
          tests/test_sqlalchemy_schema.py
          tests/test_alembic_configuration.py
          tests/test_alembic_baseline.py
          tests/test_migration_policy.py
          tests/test_database_migrate.py

      - name: Verify migration lifecycle and protected downgrade
        working-directory: backend/python
        run: uv run pytest tests/test_alembic_integration.py -v

      - name: Upgrade inherited schema to Alembic head
        working-directory: backend/python
        run: |
          uv run alembic -c alembic.ini stamp 3d0001base
          uv run python scripts/database_migrate.py upgrade

      - name: Verify head persistence and live metadata parity
        working-directory: backend/python
        run: >-
          uv run pytest
          tests/test_sqlalchemy_schema_parity.py
          tests/test_sqlalchemy_persistence.py
          -v

      - name: Verify Python default seed and idempotent replay
        working-directory: backend/python
        run: uv run pytest tests/test_seed_defaults_integration.py -v

      - name: Verify migration runner and advisory lock
        working-directory: backend/python
        run: |
          uv run pytest tests/test_database_migrate_integration.py -v
          uv run python scripts/database_migrate.py check
          uv run python scripts/database_migrate.py upgrade

      - name: Verify current head schema artifact
        working-directory: backend/python
        run: |
          uv run alembic -c alembic.ini current --check-heads
          uv run alembic -c alembic.ini check
          uv run python scripts/database_schema.py --check --revision 410001serieslinks
          uv run python scripts/sqlalchemy_schema.py --check
          uv run python scripts/seed_defaults.py
          uv run python scripts/seed_defaults.py
          uv run python scripts/alembic_baseline.py --verify

      - name: Verify clean bootstrap through all Alembic revisions
        working-directory: backend/python
        env:
          BOOTSTRAP_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finance_app_canonical_bootstrap
        run: |
          createdb --host localhost --username postgres finance_app_canonical_bootstrap
          export DATABASE_URL="$BOOTSTRAP_DATABASE_URL"
          uv run python scripts/database_migrate.py bootstrap
          uv run python scripts/database_migrate.py check
          uv run python scripts/database_schema.py --check --revision 410001serieslinks
          uv run python scripts/sqlalchemy_schema.py --check

      - name: Verify final PostgreSQL business boundary matrix
        working-directory: backend/python
        run: >-
          uv run pytest
          tests/test_auth_credentials_integration.py
          tests/test_accounts_integration.py
          tests/test_transactions_categories_integration.py
          tests/test_budgets_operational_dashboard_integration.py
          tests/test_account_invitations_integration.py
          -v

      - name: Verify version 0.1 persisted authorization acceptance
        working-directory: backend/python
        env:
          ACCEPTANCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finance_app_version_0_1_acceptance
        run: |
          createdb --host localhost --username postgres finance_app_version_0_1_acceptance
          export DATABASE_URL="$ACCEPTANCE_DATABASE_URL"
          uv run python scripts/database_migrate.py bootstrap
          uv run python scripts/database_schema.py --check --revision 410001serieslinks
          uv run pytest tests/test_version_0_1_acceptance_integration.py -v

      - name: Verify clean register-to-dashboard acceptance
        working-directory: backend/python
        env:
          CLEAN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finance_app_version_0_1_r8
        run: |
          createdb --host localhost --username postgres finance_app_version_0_1_r8
          export DATABASE_URL="$CLEAN_DATABASE_URL"
          uv run python scripts/database_migrate.py bootstrap
          uv run python scripts/database_schema.py --check --revision 410001serieslinks
          uv run pytest tests/test_version_0_1_clean_main_scenario_integration.py -v

      - name: Rehearse backup recovery without financial data loss
        working-directory: backend/python
        env:
          SOURCE_DATABASE: finance_app_version_0_1_r8
          RECOVERY_DATABASE: finance_app_r11_recovery
          RECOVERY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finance_app_r11_recovery
        run: |
          pg_dump --host localhost --username postgres --format=custom --file="$RUNNER_TEMP/r11-recovery.dump" "$SOURCE_DATABASE"
          createdb --host localhost --username postgres "$RECOVERY_DATABASE"
          pg_restore --host localhost --username postgres --dbname="$RECOVERY_DATABASE" --exit-on-error "$RUNNER_TEMP/r11-recovery.dump"
          pg_dump --host localhost --username postgres --data-only --column-inserts --no-owner --no-privileges "$SOURCE_DATABASE" | sed '/^\\restrict /d;/^\\unrestrict /d' > "$RUNNER_TEMP/r11-source.sql"
          pg_dump --host localhost --username postgres --data-only --column-inserts --no-owner --no-privileges "$RECOVERY_DATABASE" | sed '/^\\restrict /d;/^\\unrestrict /d' > "$RUNNER_TEMP/r11-restored.sql"
          diff --strip-trailing-cr "$RUNNER_TEMP/r11-source.sql" "$RUNNER_TEMP/r11-restored.sql"
          export DATABASE_URL="$RECOVERY_DATABASE_URL"
          uv run python scripts/database_migrate.py check
          uv run python scripts/database_schema.py --check --revision 410001serieslinks
          uv run python scripts/sqlalchemy_schema.py --check
