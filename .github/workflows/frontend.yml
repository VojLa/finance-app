name: Frontend

on:
  pull_request:
    paths:
      - "src/**"
      - "prisma/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.*"
      - "tailwind.config.*"
      - "postcss.config.*"
      - ".eslintrc.json"
      - ".prettierrc.json"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "prisma/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.*"
      - "tailwind.config.*"
      - "postcss.config.*"
      - ".eslintrc.json"
      - ".prettierrc.json"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/python/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: backend/python
        run: uv sync --frozen --extra dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check Python API generated contract
        run: npm run api:python:check

      - name: Run Vitest
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit --incremental false

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Check whitespace and generated cleanliness
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
